name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: wesellseals-api-free
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore Server dependencies
      run: dotnet restore
      working-directory: ./Server
    
    - name: Restore Tests dependencies
      run: dotnet restore
      working-directory: ./Server.Tests
    
    - name: Build Server
      run: dotnet build --no-restore --configuration Release
      working-directory: ./Server
    
    - name: Build Tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./Server.Tests
    
    - name: Run Authentication Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      working-directory: ./Server.Tests
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: ./Server.Tests/TestResults/test-results.trx

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./Client/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./Client
    
    - name: Run CheckoutForm Tests
      run: npm test -- CheckoutForm.test.tsx
      working-directory: ./Client
    
    - name: Run All Tests with Coverage
      run: npm run test:coverage
      working-directory: ./Client
      continue-on-error: true
    
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: ./Client/coverage

  # Build Check
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./Client/package-lock.json
    
    - name: Build Backend (Release)
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore
      working-directory: ./Server
    
    - name: Build Frontend (Production)
      run: |
        npm ci
        npm run build
      working-directory: ./Client
      env:
        VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder_for_ci_build' }}
        VITE_CLERK_PUBLISHABLE_KEY_PROD: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_PROD || 'pk_live_placeholder_for_ci_build' }}
    
    - name: Verify Backend Build Artifacts
      run: |
        echo "Checking backend build output..."
        ls -la ./Server/bin/Release/
    
    - name: Verify Frontend Build Artifacts
      run: |
        echo "Checking frontend build output..."
        ls -la ./Client/build/

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-check]
    if: always()
    
    steps:
    - name: Download Backend Test Results
      uses: actions/download-artifact@v4
      with:
        name: backend-test-results
        path: ./test-results/backend
      continue-on-error: true
    
    - name: Download Frontend Coverage
      uses: actions/download-artifact@v4
      with:
        name: frontend-coverage
        path: ./test-results/frontend
      continue-on-error: true
    
    - name: Display Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Backend Authentication Tests: Completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Frontend CheckoutForm Tests: Completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build Verification: Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View detailed results in the job artifacts above." >> $GITHUB_STEP_SUMMARY

  # Deploy to Azure (only on main branch)
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./Server
      
      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./Server
      
      - name: Publish
        run: dotnet publish -c Release -o ./publish
        working-directory: ./Server
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./Server/publish

  deploy-frontend:
    name: Deploy Frontend (Static Web App)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-check, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./Client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./Client
      
      - name: Build
        run: npm run build
        working-directory: ./Client
        env:
          VITE_API_URL: ${{ secrets.AZURE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client"
          output_location: "dist"
          skip_app_build: true

  # Optional: Auto-merge dependabot PRs if tests pass
  # dependabot-auto-merge:
  #   name: Auto-merge Dependabot PRs
  #   runs-on: ubuntu-latest
  #   needs: [build-check]
  #   if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
  #   steps:
  #     - name: Enable auto-merge
  #       run: gh pr merge --auto --squash "$PR_URL"
  #       env:
  #         PR_URL: ${{github.event.pull_request.html_url}}
  #         GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}