name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, ci-cd ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore Server dependencies
      run: dotnet restore
      working-directory: ./Server
    
    - name: Restore Tests dependencies
      run: dotnet restore
      working-directory: ./Server.Tests
    
    - name: Build Server
      run: dotnet build --no-restore --configuration Release
      working-directory: ./Server
    
    - name: Build Tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./Server.Tests
    
    - name: Run Authentication Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      working-directory: ./Server.Tests
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: ./Server.Tests/TestResults/test-results.trx

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./Client/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./Client
    
    - name: Run CheckoutForm Tests
      run: npm test -- CheckoutForm.test.tsx
      working-directory: ./Client
    
    - name: Run All Tests with Coverage
      run: npm run test:coverage
      working-directory: ./Client
      continue-on-error: true
    
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: ./Client/coverage

  # Build Check
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./Client/package-lock.json
    
    - name: Build Backend (Release)
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore
      working-directory: ./Server
    
    - name: Build Frontend (Production)
      run: |
        npm ci
        npm run build
      working-directory: ./Client
      env:
        VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder_for_ci_build' }}
    
    - name: Verify Backend Build Artifacts
      run: |
        echo "Checking backend build output..."
        ls -la ./Server/bin/Release/
    
    - name: Verify Frontend Build Artifacts
      run: |
        echo "Checking frontend build output..."
        ls -la ./Client/build/

  # Deploy to Azure Production
  deploy-production:
    name: Deploy to Azure Production
    runs-on: ubuntu-latest
    needs: [build-check]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wesellseals-client.azurestaticapps.net
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./Client/package-lock.json
    
    # Build and Publish Backend
    - name: Restore Backend Dependencies
      run: dotnet restore
      working-directory: ./Server
    
    - name: Publish Backend
      run: dotnet publish --configuration Release --output ./publish
      working-directory: ./Server
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Login to Azure Container Registry
      run: |
        az acr login --name wesellsealsacr
    
    - name: Build and Push Docker Image
      working-directory: ./Server
      run: |
        docker build -t wesellsealsacr.azurecr.io/wesellseals-api:${{ github.sha }} -t wesellsealsacr.azurecr.io/wesellseals-api:latest -f Dockerfile .
        docker push wesellsealsacr.azurecr.io/wesellseals-api:${{ github.sha }}
        docker push wesellsealsacr.azurecr.io/wesellseals-api:latest
    
    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name wesellseals-api \
          --resource-group WeSellSeals-Production-RG \
          --image wesellsealsacr.azurecr.io/wesellseals-api:latest \
          --target-port 8080 \
          --set-env-vars \
            "ConnectionStrings__AzureSqlConnection=${{ secrets.AZURE_SQL_CONNECTION_STRING }}" \
            "Stripe__SecretKey=${{ secrets.STRIPE_SECRET_KEY }}" \
            "Clerk__Domain=${{ secrets.CLERK_DOMAIN }}" \
            "ASPNETCORE_ENVIRONMENT=Production" \
            "ASPNETCORE_URLS=http://+:8080"
    
    # Run Database Migrations
    - name: Install EF Core Tools
      run: dotnet tool install --global dotnet-ef
    
    - name: Run Database Migrations
      run: |
        dotnet ef database update --project ./Server
      env:
        ASPNETCORE_ENVIRONMENT: Production
        AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
    
    # Build and Deploy Frontend
    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: ./Client
    
    - name: Build Frontend
      run: npm run build
      working-directory: ./Client
      env:
        VITE_API_URL: ${{ secrets.AZURE_API_URL }}
        VITE_STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
        VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    
    - name: Deploy Frontend to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "Client/build/client"
        output_location: "."
        skip_app_build: true
        skip_api_build: true
    
    - name: Logout from Azure
      run: az logout
      if: always()

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-check]
    if: always()
    
    steps:
    - name: Download Backend Test Results
      uses: actions/download-artifact@v4
      with:
        name: backend-test-results
        path: ./test-results/backend
      continue-on-error: true
    
    - name: Download Frontend Coverage
      uses: actions/download-artifact@v4
      with:
        name: frontend-coverage
        path: ./test-results/frontend
      continue-on-error: true
    
    - name: Display Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Backend Authentication Tests: Completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Frontend CheckoutForm Tests: Completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build Verification: Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View detailed results in the job artifacts above." >> $GITHUB_STEP_SUMMARY

  # Optional: Auto-merge dependabot PRs if tests pass
  # dependabot-auto-merge:
